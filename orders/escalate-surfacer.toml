# Escalate-surfacer — naming-independent delivery of escalate rollups to Slack.
#
# Closes a silent delivery outage: the oversight-rig pack's `escalate-rollups`
# order only delivers `severity:escalate` rollups for rigs whose project-lead
# session uses the pack naming `<rig>/oversight-rig.project-lead`. Rigs with
# bespoke PLs (codeprobe, gascity-dashboard, scix-experiments, enterprisebench,
# mem, gascity-maintenance) fail that resolver, so their escalate rollup beads
# rot OPEN and the human never sees them.
#
# This order runs bin/escalate-surfacer every 15m: for EVERY rig it finds OPEN
# escalate rollup beads NOT labeled `delivered`, posts each straight to
# #gascity-maintenance (C0B0TQMQF2B) via the same direct slack-adapter publish
# path bin/stall-watch uses (`gc slack publish-to-channel`), then stamps
# `delivered` on success. Dedup is the `delivered` label itself; per-bead
# fail-safe leaves a failed post unstamped to retry next tick. Mayor is the
# responder, never the trigger — the script does the delivery directly.
#
# Silent when there is nothing undelivered (self-skips per rig). One post per
# undelivered bead, exactly once, enforced by the delivered-label dedup.
#
# NOTE: --post makes this LIVE. The script defaults to dry-run; this order
# opts into posting. Pending mayor review before the order is registered.

[order]
description = "Every 15m: deliver OPEN severity:escalate rollups lacking the 'delivered' label to #gascity-maintenance for ALL rigs (naming-independent backstop to the oversight-rig pack's escalate-rollups order). Dedup'd via the delivered label; per-bead fail-safe; silent when clean."
trigger = "cooldown"
interval = "15m"
exec = "/home/ds/gas-city/bin/escalate-surfacer --post"
timeout = "2m"
