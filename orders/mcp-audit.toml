# 2026-07-07 (gc-457861 Part B/C): cadence 168h -> 24h. mcp-audit IS the dead-weight
# detector (tool-call-usage vs procs+RSS) — the resource-observability sampler covers
# the fan-out proc/RSS numbers but NOT the 0-tool-calls signal, so DON'T retire this;
# just run it daily so a server regrowing to a fan-out at 0 usage is caught in ~1 day,
# not ~7 (code-intel-copilot took 3 weeks to regrow unnoticed under the weekly cadence).
[order]
description = "Daily: audit MCP fan-out + DEAD-WEIGHT. For each configured MCP server, compare live process count + RSS (summed across all sessions that spawn a copy) against actual mcp__<server>__ tool-call usage in recent logs. Flags servers with procs+RAM but ZERO calls (dead weight loaded by every session — e.g. code-intel-copilot was 151 procs/5.2G at 0 calls, trimmed 2026-06-16, regrew unnoticed under weekly cadence). Nudges mayor on any DEAD server; trimming the config is a mayor decision. Complements resource-observability (which covers fan-out proc/RSS but not usage). gc-457861."
trigger = "cooldown"
interval = "24h"
exec = "/home/ds/gas-city/bin/mcp-audit --nudge-mayor --days 3"
timeout = "120s"
idempotent = true
