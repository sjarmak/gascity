# mayor-mail-janitor — daily mayor-mailbox hygiene, two rules, one
# beads.json parse (see bin/mayor-mail-janitor header).
#
# Merged 2026-07-21 (order-layer consolidation, city audit sec 2.1 + 4.4,
# epic gc-28w2): absorbed mail-dupe-dedupe, which full-parsed the 62MB
# .gc/beads.json HOURLY (~0.5-1GB transient RSS, 24x/day) to collapse
# body-identical escalator mail. Same mailbox, same archive mechanism; dupe
# collapse now rides this daily 04:00 run. Undo: restore
# orders/mail-dupe-dedupe.toml + bin/mail-dupe-dedupe from this commit's
# parent in git if hourly dedup latency ever matters again.
[order]
description = "Daily 04:00 EDT: mayor-mailbox hygiene in one pass — archive mayor-addressed message beads older than 7 days (inbox grew unbounded without it; 488 -> 0 sweep 2026-05-20) AND collapse duplicate (same recipient+subject+body-sha) escalator mail, keeping the newest per group. Formerly two orders (this + hourly mail-dupe-dedupe)."
trigger = "cron"
schedule = "0 4 * * *"
exec = "/home/ds/gas-city/bin/mayor-mail-janitor"
timeout = "5m"
