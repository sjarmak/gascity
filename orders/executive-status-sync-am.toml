# Aggregate the 09:30 project-lead inputs after a 40-minute composition window.
# This is the only routine portfolio Slack post; urgent decisions remain
# event-driven and separate.
[order]
description = "Daily 10:10 EDT: build the CEO-level Obsidian portfolio brief and publish it once to Slack when content changed."
trigger = "cron"
schedule = "10 10 * * *"
exec = "/home/ds/gas-city/bin/executive-status-sync"
timeout = "3m"
idempotent = true
