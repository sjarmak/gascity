# fork-pr-approval-gate — Stephanie directive 2026-07-03 (option a: alert-then-approve).
# Detects open gastownhall/gascity PRs whose REQUIRED checks (CI/CodeQL) are stuck in
# GitHub Actions 'action_required' (the fork/outside-contributor workflow-approval gate
# that silently blocks merges). DETECT-ONLY: alerts mayor with the list + the one-command
# approve; the approval itself stays human-directed (Stephanie says go, mayor runs
# --approve). Deduped on the PR-set signature so an unchanged set doesn't re-alert.
# Bridges until the permanent repo Actions-setting change (Julian escalation, deferred).
[order]
description = "Every 30m: detect open gastownhall/gascity PRs with REQUIRED checks (CI/CodeQL) stuck in GitHub 'action_required' and alert mayor with the list + one-command approve. Detect-only; approval is human-directed (write-access, no Julian). Signature-deduped."
trigger = "cron"
# Restaggered */30 -> :18/:48 2026-07-21 (herd de-stack, city audit sec 4.6 +
# epic gc-28w2; stagger precedent in approved-pr-automerge-packs). Same
# cadence, same coverage.
schedule = "18,48 * * * *"
exec = "/home/ds/gas-city/bin/fork-pr-approval-gate --nudge-mayor"
timeout = "3m"
