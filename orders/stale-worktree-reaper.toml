# Expanded 2026-07-20 by Stephanie's direct request after ten unlocked,
# clean+merged CodeScaleBench worktrees retained 194G while this order reported
# zero candidates. The new cross-rig/unlocked scope is staged DRY-RUN first per
# city change control. Promote by adding --apply only after reviewing its report;
# the implementation still caps removals at 10, never uses --force, retains
# branch refs, and fails closed on active bead-store references.
[order]
description = "Hourly dry-run: report registered worktrees across every rig that are clean, merged, inactive, unreferenced, and ≥3d stale; include size. Expanded beyond locked-only discovery after the 194G CodeScaleBench incident."
trigger = "cooldown"
interval = "1h"
exec = "/home/ds/gas-city/bin/stale-worktree-reaper --include-unlocked --threshold 3d --max-remove 10 --nudge-mayor"
timeout = "20m"
