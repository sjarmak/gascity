# Durable fix for the 2026-07-14 order-firing stall (RCA: dr-7smz8,
# docs/rca-order-firing-stall-filestore-bloat-2026-07-14.md).
#
# WHY: the gc file store (.gc/beads.json) has no reaper. bead-prune-reaper is
# Dolt-only and bead-janitor is .disabled, so closed NON-order-tracking beads —
# gc's own session records — accumulate forever. Every order SetCursor/CreateRun
# does a FileStore.reloadFromDisk (full-file json.Unmarshal) under the
# flock+mutex, so once the file is large enough the order dispatcher starves:
# on 2026-07-14 at 168MB/79K beads, orders ran 10-30x overdue until a manual
# compaction. The manual run is not a fix — the store regrew from 82MB to 105MB
# in the 6h after it, ~3.7MB/h, and returns to stall size in about a day.
#
# WINDOWS: 6h for transient order-tracking beads, while generic closed history
# stays at 7d. Approved by Stephanie 2026-07-25 in Amp thread
# T-019f8a15-7e09-7049-9ef2-438067d63866 after dr-clh5: even after the event
# scanner storm was contained, the city created ~568 tracking rows/hour. A 2d
# window still left 16K tracking rows and a 43MB file, costing ~9.8 CPU-seconds
# per reload. Hourly compaction with a 6h window holds that transient class near
# 3K rows while preserving ordinary closed history and the 10 newest runs/order.
#
# SAFETY: closed-only (a non-closed bead in the delete set aborts the write);
# retains the 10 most recent order-tracking beads per order regardless of age;
# LOCK_EX on the same beads.json.lock every FileStore write takes; backup +
# atomic rename. The identical operation ran against 24,550 beads on 2026-07-14
# with no fallout (16 orders fired in the following 15 min).
#
# SHIPS IN DRY-RUN. Per the city's janitor convention, a human reviews at least
# one dry-run report and flips COMPACT_APPLY to "1" here, annotated with who and
# when. Until then this order only reports what it would remove.
#
# UNDO: retire this order if gc upstream grows a retention policy for closed
# non-order-tracking beads in the file store, or if the city's own beads
# provider moves off the file backend.

[order]
description = "Janitor: compact closed beads out of the gc file store (.gc/beads.json) so order dispatch doesn't starve on reloadFromDisk (dry-run until enabled)"
trigger = "cooldown"
interval = "1h"
exec = "/home/ds/gas-city/bin/beads-json-compact-order-tracking.py"
timeout = "300s"
# Re-running is a no-op re-evaluation: a pass that finds nothing past the TTL
# deletes nothing and does not write. Safe to fire even when starved
# (gastownhall/gascity#2893 fail-open).
idempotent = true

[order.env]
COMPACT_APPLY = "1"              # PROMOTED (Stephanie, 2026-07-14, via mayor) after reviewing the clean dry-run: 26,603 delete / 28,653 keep, deps 60->31, no non-closed beads in the delete set
COMPACT_CLOSED_ANY_DAYS = "7"    # preserve the longer audit window for ordinary closed beads
COMPACT_TTL_DAYS = "0.25"        # 6h transient window approved 2026-07-25 after post-fix profile + measured generation rate
COMPACT_RETAIN_LAST = "10"       # keep the 10 newest tracking beads per order regardless of age
