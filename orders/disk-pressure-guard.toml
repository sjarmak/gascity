# Expanded 2026-07-20 by Stephanie's direct request after root reached 99%:
# 30G was only 1.5% of this disk and the allowlist missed a 57G/13.7M-file bd
# telemetry queue. Warning/action/critical are now 300G/200G/100G; disabled bd
# telemetry is bounded at 1G. Revert to the 20260720T020513Z sibling snapshot
# only if the wider early-warning policy produces measured false pressure.
#
# disk-pressure-guard — mayor gc-431237 (pre-cleared). Root hit 100% today; go-build
# regrows ~4-8G/cycle. Every 30m: if root free < action threshold (default 200G), delete the
# CONTENTS of a hardcoded allowlist of REGENERABLE caches (go-build, golangci-lint,
# staticcheck, pip, uv) — they rebuild on next use. HARD RULES: never `go clean -cache`
# (banned, corrupts fleet GOCACHE); never touch .cache/huggingface or .ollama (active
# data — off the allowlist + a defensive protected-path assert). Trims only cache
# CHILDREN. No-op when free is fine or caches are empty. Audited; nudges mayor when it
# frees >=0.5G. Stopgap for the home-dir side (the ~1.5T outside /home/ds is Stephanie's).
[order]
description = "Every 30m: warn/action/critical below 300/200/100G free or at 85/90/95% inode use; trim allowlisted regenerable caches and disabled bd telemetry over 1G allocated. Never go clean -cache; never huggingface/ollama. Audited; nudges mayor on real reclaim."
trigger = "cron"
# Restaggered */30 -> :11/:41 2026-07-21 (herd de-stack, city audit sec 4.6 +
# epic gc-28w2; stagger precedent in approved-pr-automerge-packs). Same
# cadence, same coverage.
schedule = "11,41 * * * *"
exec = "/home/ds/gas-city/bin/disk-pressure-guard --apply --nudge-mayor"
timeout = "5m"
