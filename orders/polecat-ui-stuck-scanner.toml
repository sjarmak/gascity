# 2026-07-21 (order-layer consolidation, city audit sec 2.1 + epic gc-28w2):
# the wedged-dispatcher pass (DISPATCHER_STALE_SEC + kill) was DELETED from
# the scanner — dispatcher-liveness-sensor (detector) + dispatcher-watchdog
# (kill actuator: idle>=5h OR conversion-stall) own that signal; the
# scanner's 6h-idle kill was a redundant third threshold. A 529-wedge
# classifier was folded IN from the retired pl-529-recovery order,
# SURFACE-ONLY (no kill/reset authority), riding the existing peek fan-out.
# See bin/polecat-ui-stuck-scanner header; undo via git.
[order]
description = "Every 5m: detect sessions blocked waiting on input — UI modals (slash/model/theme selectors), supervisor pending-interactions (permission/approval prompts), auth-wedges (OAuth login screens), and 529-wedges (final turn is the literal 529 error, REPL idle; two-scan confirmed, surface-only) — that read as 'active' but are unreachable for routed work. Surfaces each to the mayor (no agent should sit blocked on a human prompt; mayor triages, auto-handles routine/permission cases, escalates only genuine decisions to Stephanie). AUTO_RESET off by default (surface-only except modal SELECTORS, which a text nudge provably cannot clear — cf. mayor-watchdog reset-storm). Implements gc-492g2."
trigger = "cooldown"
interval = "5m"
exec = "/home/ds/gas-city/bin/polecat-ui-stuck-scanner"
# 2026-07-19 (dr-phcu, city-infra-polecat-1): raised 2m -> 4m. The fleet grew
# to ~70 active sessions and `gc session peek` costs ~11s under load; every
# run since 07-17 03:47 was killed at 2m before completing (no scan-summary in
# ~/.gc/polecat-ui-stuck.log for 2+ days — alerts mid-run still fired, but
# state never saved and resolution never ran). The scanner now fetches the
# session list once and peeks in one parallel fan-out (measured full scan:
# 1m43s); 4m gives ~2x headroom for further fleet growth. Undo: drop back to
# 2m only if the measured scan time falls well under 60s.
timeout = "4m"
