# vault-status-mirror — mirror new Obsidian Projects/*.md daily-log entries to
# #gascity-maintenance (Stephanie 2026-07-11: "what PLs post in the vault should
# get mirrored to slack"). PLs already write dated status to the vault under the
# standing VAULT_NOTES directive; this order adds the missing vault -> Slack leg.
#
# Idempotent: per-project sha256 sentinel under ~/.gc/vault-mirror-sentinels/.
# First run SEEDS every sentinel without posting (no history backfill); only a
# changed newest-dated block posts thereafter. Read-only on the vault.
#
# trigger=cooldown deliberately (no zero-lastRun bootstrap trap; same reasoning
# as decision-ledger-push.toml). Channel override: VAULT_MIRROR_CHANNEL.
[order]
description = "Every 15m: mirror each project's newest changed Obsidian daily-log block to #gascity-maintenance. Per-project sha sentinel; first run seeds without posting; codepoint-safe."
trigger = "cooldown"
interval = "15m"
exec = "/home/ds/gas-city/bin/vault-status-mirror"
timeout = "3m"
idempotent = true
