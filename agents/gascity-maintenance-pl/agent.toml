# Moved 2026-07-19 per Stephanie: the PL must operate from the gascity rig's
# bead-bearing workspace so bd reads and dispatch resolve gc-* source work.
# /home/ds/gascity-main remains exclusively owned by gcsync for binary builds.
# Revert only if the rig's canonical bead store moves to a different checkout.
work_dir = "/home/ds/gascity"
# 2026-07-18 per Stephanie: project leads run through Amp's medium profile.
# Revert from the sibling pre-migration snapshot if binding or resume regresses.
provider = "amp-medium"
min_active_sessions = 0
max_active_sessions = 1
wake_mode = "resume"
idle_timeout = "1h"

[env]
GC_CITY = "/home/ds/gas-city"
GC_BEADS = "bd"
