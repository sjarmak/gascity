# city-infra-polecat: the live city-infra execution lane. Works dr-* beads
# (city-infra queue) with host access to edit /home/ds/gas-city files.
# History: deprecated 2026-05-29 for a store-mismatch (file-backed city store
# vs dolt gascity-rig beads), then reinstated once city-infra work moved to
# the dr- store this agent can see; the 2026-07-14 floor comments below track
# that era. Currently suspended = true via the cleanup-pause [[patches.agent]]
# override in city.toml (2026-07-21) — the patch wins over the value here;
# remove the patch, not this file, to resume the lane.
suspended = false
dir = "/home/ds/gas-city"
work_dir = "/home/ds/gas-city"
provider = "claude-2"
# Queue floor: 0 = no warm slot pinned; spawns on demand up to max 3.
# Raise to 1 only while a P0 city-infra queue is actively draining, and
# revert to 0 when drained (dr-8sy NOTES: a permanent warm city-infra slot
# is unwanted). Floor history: 2026-07-13 set to 1 for dr-7mb/dr-rz3/dr-jeu,
# auto-reverted 2026-07-14 when all three closed (gc-483862/gc-483890).
min_active_sessions = 0
max_active_sessions = 3
wake_mode = "fresh"
idle_timeout = "6h"
default_sling_formula = "mol-do-work"

[env]
GC_CITY = "/home/ds/gas-city"
GC_BEADS = "bd"
