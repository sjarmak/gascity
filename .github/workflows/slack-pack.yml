name: slack-pack

on:
  push:
    branches: [main]
    paths:
      - "examples/slack-pack/**"
      - ".github/workflows/slack-pack.yml"
  pull_request:
    paths:
      - "examples/slack-pack/**"
      - ".github/workflows/slack-pack.yml"

permissions:
  contents: read

concurrency:
  group: slack-pack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  adapter-go-tests:
    name: Adapter Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/slack-pack/adapter
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: examples/slack-pack/adapter/go.mod
          cache: false
      - name: go test -race
        run: go test -race ./...

  pack-python-tests:
    name: Pack Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: pytest
        run: pytest examples/slack-pack/tests/
