# Drop-in that ARMS the maintenance worker: binds the persisted RealAdapter and
# real create+sling selection. Install as
# ~/.config/systemd/user/temporal-maintenance-worker.service.d/armed.conf then
# `systemctl --user restart temporal-maintenance-worker.service`. Remove it +
# restart to revert to shadow (DryRunAdapter). This is the reversible half of the
# cutover flip; the other half is the Schedule (deploy/schedule-arm.sh).
[Unit]
# Journal lines otherwise read "shadow worker ... executes nothing" while armed.
Description=temporal-maintenance — ARMED worker (binds RealAdapter: creates and slings real beads)

[Service]
Environment=TEMPORAL_MAINT_ARMED=1
Environment=GC_CITY_DIR=%h/gas-city
Environment=TEMPORAL_MAINT_STORE_DIR=%h/.local/share/temporal-maintenance/execstore
Environment=TEMPORAL_MAINT_POLECAT=/home/ds/gascity/polecat
# Legacy maintenance-cycle created both halves at priority 2 — match it.
Environment=TEMPORAL_MAINT_PRIORITY=2
Environment=TEMPORAL_MAINT_PROMPT_REVIEW=%h/gas-city/services/temporal-maintenance/prompts/review.md
Environment=TEMPORAL_MAINT_PROMPT_AUTHOR=%h/gas-city/services/temporal-maintenance/prompts/author.md
Environment=TEMPORAL_MAINT_SLACK_CHANNEL=C0B25SS12CD
Environment=TEMPORAL_MAINT_PL_AGENT=gascity-maintenance-pl
# The shadow worker executes nothing, so the base unit's 256M/384M ceiling fits
# it (peak ~19M). The armed worker forks the real gc toolchain (gc session list,
# gc sling, git worktree add) as children in THIS cgroup, and `gc session list
# --json` alone peaks at ~455M RSS — above the base MemoryMax=384M. Measured
# 2026-07-16: the cgroup pinned above MemoryHigh with 12k+ reclaim-throttle
# events and no OOM kill, so gc-sling's dead-target probe stalled past the
# activity's 5m deadline and every sling died "signal: killed" with the create
# half already done. Sized ~3x the measured peak.
MemoryHigh=1536M
MemoryMax=2G

# ProtectHome/ProtectSystem are inert for user units on this box
# (kernel.apparmor_restrict_unprivileged_userns=1 → systemd skips the mount
# namespace silently; the worker shares the host mnt ns, verified 2026-07-16).
# They would activate — and break gc-sling's worktree writes under
# /home/ds/gascity, outside any ReadWritePaths — if that restriction were ever
# lifted. gc-sling is trusted city infra needing a normal filesystem view, so
# disable them explicitly rather than rely on them staying inert.
ProtectHome=no
ProtectSystem=no
