# 20260706T175816Z), NOT a registration bug — the loader honors enabled=false,
# which is why this order alone is absent from `gc order list` yet survives
# reboots and `gc order show` still resolves it. Kept disabled: the Temporal
# maintenance-Run Schedule is the sole driver of maintenance-cycle dispatch as
# of the gc-372 P5 cutover (armed 2026-07-16, 120m Skip-overlap, dispatch-only).
# Re-enabling here would double-dispatch. Legacy retirement plan (gc-372): after
# a clean Temporal week (~2026-07-23), mv orders/maintenance-cycle.toml to
# .toml.disabled. RCA: gc-qo3.
[[orders.overrides]]
name = "maintenance-cycle"
enabled = false

# Retired 2026-07-21 (order-layer consolidation, city audit sec 3 + epic
# gc-28w2): zero detections since 2026-05-25 — state file
# .gc/runtime/packs/maintenance/spawn-storm-counts.json is `{}` with a
# creation-date mtime. The local orders/spawn-storm-detect.toml was renamed
# .toml.disabled, but the name is ALSO defined by the embedded core pack
# (gc cache internal/bootstrap/packs/core), which kept firing every ~5m;
# this override is what actually silences it. Remove the override AND
# restore the local .toml if reset-to-pool crash-loops recur without
# reaper coverage (orphaned-molecule-reaper + 07-21 stuck-state sweeper).
[[orders.overrides]]
name = "spawn-storm-detect"
enabled = false

[api]
port = 9443
bind = "127.0.0.1"

[convergence]
max_per_agent = 2
max_total = 10

[agent_defaults]
wake_mode = "resume"
default_sling_formula = "mol-focus-review"
append_fragments = ["cass-search"]

[[rigs]]
name = "embertide"
max_active_sessions = 20
prefix = "embertide"
default_branch = "architecture-refresh"
suspended_on_start = true
[rigs.imports]
[rigs.imports.oversight-rig]
source = "/home/ds/gascity-packs-worktrees/oversight-rig/oversight-rig"

[[rigs.overrides]]
agent = "project-lead"
suspended = true
provider = "claude-auto"

[providers.amp]
base = "builtin:amp"
# 2026-07-17: Amp-native mayor profile. New mayor threads start in high mode;
# resumed threads retain their creation mode. Global/project plugins provide
# hooks, safety, shared assets, and high-mode specialist delegation.
# 2026-07-18: Amp's interactive TUI ignores positional prompt arguments.
# Deliver startup prompts through the managed first nudge instead; revert only
# if Amp restores interactive argv-prompt submission or gc gains stdin delivery.
args = ["--no-ide", "--mode", "high"]
prompt_mode = "none"
supports_hooks = true
instructions_file = "AGENTS.md"
resume_command = "amp --no-ide --mode high threads continue {{.SessionKey}}"

[providers.amp-medium]
base = "builtin:amp"
# 2026-07-18 per Stephanie: project leads move to Amp's medium mode while the
# mayor keeps its separate high-mode profile. Revert the PL provider lines to
# their pre-migration snapshots if thread binding, resume, or hooks regress.
# Amp interactive startup requires prompt delivery through gc's first nudge;
# positional argv prompts open an unprimed generic TUI.
args = ["--no-ide", "--mode", "medium"]
prompt_mode = "none"
supports_hooks = true
instructions_file = "AGENTS.md"
resume_command = "amp --no-ide --mode medium threads continue {{.SessionKey}}"
