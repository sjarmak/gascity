# === CLEANUP PAUSE 2026-07-21 ===
# Pack-defined pool agents suspended for the cleanup pause. `gc agent suspend`
# refuses these ("defined by a pack — use [[patches]] to override"), so the
# suspension lives here. The 23 city-level PLs were suspended via `gc agent
# suspend` and carry suspended=true in their own agent.toml.
#
# WHY: the box is structurally overcommitted (postgres 15.0G + gascity.slice
# 32G + app.slice 12G against 62G RAM, swap 100% consumed). gascity.slice sat
# pinned at its 32G MemoryMax and the memcg killer took the canonical bead-store
# dolt three times on 2026-07-21, each kill flipping its port and freezing the
# order floor. Zeroing min_active floors alone did not converge: routed work
# kept respawning pool members.
#
# UNDO: delete this whole block AND restore the min_active_sessions floors from
# commit fbe6566 (`git show fbe6566`), then `gc agent resume <name>` for the 23
# PLs. Do not resume piecemeal — floors and patches were changed together.
# Refs: gc-qaid, gc-pif5, .gc-reports/city-audit-2026-07-21.md sec 0/7

[[patches.agent]]
dir = "/home/ds/gas-city"
name = "city-infra-polecat"
provider = "claude-4"
suspended = true

[[patches.agent]]
dir = "/home/ds/gascity-dashboard"
name = "gascity-dashboard-worker"
provider = "claude-4"
suspended = true

[[patches.agent]]
dir = "/home/ds/gascity-packs"
name = "gascity-packs-polecat"
provider = "claude-4"
suspended = true

