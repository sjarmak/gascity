[providers]
# 2026-07-20 per Stephanie in mayor thread T-019f7b8c: managed Claude agents
# must not inherit the mutable last-selected model from an OAuth account's
# settings.json. Inherit the builtin Claude option schema and emit Opus 4.8 as
# an explicit --model baseline; agent/per-dispatch option_defaults still win.
# Keep effort unset and the legacy near-zero ready delay so importing the model
# schema does not also change reasoning policy or add 10s to every launch.
# Remove this only when another launch-layer mechanism always emits each
# agent's configured model without consulting account-local defaults.
[providers.claude-1]
base = "builtin:claude"
display_name = "Claude (Account 1)"
command = "/home/ds/gas-city/bin/claude-account"
args = ["1"]
option_defaults = { effort = "", model = "opus" }
prompt_mode = "arg"
ready_delay_ms = 1
ready_prompt_prefix = "❯"
process_names = ["claude"]
supports_hooks = true
instructions_file = "CLAUDE.md"
resume_flag = "--resume"
resume_style = "flag"
session_id_flag = "--session-id"
fork_flag = "--fork-session"
[providers.claude-1.env]
DISABLE_INTERACTIVITY = "1"
