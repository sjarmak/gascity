description = """
Rig patrol — scan all active rigs for open beads, check progress,
identify blockers, and report to the human.

The mayor runs this periodically (via order or manually) to ensure
work is moving across all rigs. It:

1. Lists open beads per rig
2. Checks which have agents working on them vs idle
3. Identifies blocked convoys or stalled work
4. Dispatches unassigned ready beads to available agents
5. Sends a concise status summary to the human

No variables required — it scans all non-suspended rigs from city.toml.
"""
formula = "mol-patrol"
phase = "vapor"
version = 1

[[steps]]
id = "patrol"
title = "Scan rigs and report status"
description = """
You are running a patrol of all active rigs. Your goal: make sure work
is moving and the human knows what needs their attention.

**1. Get the lay of the land:**
```bash
gc rig list
gc session list --json
```

**2. For each non-suspended rig, check open beads:**
```bash
gc bd --rig <rig-name> list -s open --pretty
gc bd --rig <rig-name> list -s in_progress --pretty
```

Also check for blocked beads:
```bash
gc bd --rig <rig-name> list -s blocked --pretty
```

**3. For each rig with open work, assess status:**

- **Progressing**: Bead is in_progress and has an active session working on it.
- **Idle**: Bead is open/ready but no agent is assigned or working on it.
- **Blocked**: Bead has unsatisfied dependencies or is explicitly blocked.
- **Stalled**: Bead is in_progress but the agent session is suspended/dead.
- **Needs human**: Bead has notes requesting human input, or a review/meta-review failed.

**4. Take action on idle work:**

For each idle, ready bead with no agent:
```bash
gc sling <rig-name>/<available-agent> <bead-id>
```

Pick agents that are not currently busy (check `gc session list`).
Distribute across available providers to parallelize.

**5. Compile the status report and send to the human:**

```bash
gc mail send human -s "Patrol report" -m "$(cat <<'REPORT'
## Rig Patrol — $(date +'%Y-%m-%d %H:%M')

### Progressing
[rig/bead-id: title — agent working on it]

### Just dispatched
[rig/bead-id: title — agent assigned]

### Blocked / needs you
[rig/bead-id: title — why it's blocked, what you need to do]

### Completed since last patrol
[rig/bead-id: title — summary of what was done]

### Rigs with no open work
[list of idle rigs — suggest new assignments if relevant]
REPORT
)"
```

**Rules:**
- Be concise. The human wants a quick scan, not a novel.
- Only include sections that have content. Skip empty sections.
- If everything is progressing and nothing needs attention, say so in one line.
- If a convoy has completed all work+review+meta-review beads, flag it as
  "ready for human review" in the Blocked/needs you section.
- Do NOT close beads. Do NOT modify bead content. Only dispatch and report.
"""

[[steps]]
id = "drain"
title = "Signal completion"
needs = ["patrol"]
description = """
Work is done. Signal the controller to reclaim this session:

```bash
gc runtime drain-ack
```

Run this command and nothing else."""
