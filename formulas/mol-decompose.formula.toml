# v2 installed 2026-07-07 (dr-j0d.4; draft source: docs/design/fable-distillation/formula-drafts/mol-decompose/, superseded v1 in docs/design/fable-distillation/superseded-originals-2026-07-07/). §4.8 input-authority rule + §4.9 fixture-quality gate added at install (diff-report §4).
# 2026-07-13 (dr-jeu, rubric wiring stage 2): step-4 bead creation now declares per docs/conventions/bead-declaration-rubric.md — inherited --priority (ROOT_PRI, never self-escalate), --estimate p50 minutes, and the schema_version-1 orchestrator metadata block (requirements/structure/estimates) on the work bead; review + meta-review beads inherit priority. Instruction payload only; steps/vars/routing metadata otherwise unchanged.
# Changes vs live v1 (instruction payload only; steps, vars, bd mechanics, routing metadata unchanged):
#   1. Acceptance criteria: discriminating-check rule (strip-the-scope test + stub test), planted-defect
#      negative fixtures required for any checker/validator unit, two good/bad contrast pairs.
#   2. Traceability: every unit cites the root-bead text it implements; gold-plating is a defect;
#      coverage is swept in both directions.
#   3. Dependency honesty: waves re-derived from per-unit deps; a linear chain or a fully parallel
#      graph triggers re-examination; narrative order is not a data dependency.
#   4. Routing by cognitive-load tier (deep reasoning / well-scoped execution / mechanical) replaces
#      hardcoded model names; fan-out gate rule blocks downstream units on the REVIEW bead so a wrong
#      early result cannot poison later waves; sampling gates on cheap-routed bulk work.
#   5. Mandatory underspecification pass (question + provisional assumption + pin-by point) BEFORE
#      any bead is created; silent ambiguity resolution is a defect.

description = """
Decompose phase — read research and brainstorm findings from the convoy root
bead, then create child work beads with acceptance criteria, review beads,
and meta-review beads.

This replaces the traditional PRD document. Each work unit becomes a bead
with acceptance criteria in its description. Review and meta-review beads
are created with dependency links so they auto-unblock in sequence:

  work bead → (blocks) → review bead → (blocks) → meta-review bead

Each work bead gets routing metadata. The dispatcher owns the mapping from
routing value and cognitive-load tier to whatever models are current — never
name a model in bead content:
  - gc.routing=criteria-only → flexible implementation; any code that passes
    the acceptance criteria is acceptable
  - gc.routing=prescriptive  → exact implementation required
"""
formula = "mol-decompose"
phase = "liquid"
version = 2

[vars]
[vars.issue]
description = "The convoy root bead ID (has research + brainstorm notes)"
required = true

[vars.rig]
description = "The rig name (for bd prefix and routing)"
required = true

[[steps]]
id = "decompose"
title = "Create work beads with acceptance criteria and review chain"
description = """
You are decomposing a researched topic into work units that mid-tier workers
will execute independently, in parallel where dependencies allow. Their output
is only as good as the acceptance criteria and dependency structure you hand
them: a vague criterion or a false dependency here costs an entire wave
downstream.

**1. Read ALL accumulated context:**
```bash
bd show {{issue}}
```

The NOTES section contains:
- Research findings (divergent perspectives, convergence decisions, premortem risks)
- Brainstorm results (top candidates, selected direction)

Read everything carefully. This is your ONLY input — there are no separate files.

**2. Surface underspecification BEFORE designing units.**

List every ambiguity in the notes: conflicting IDs or numbering, sequencing
language that may be priority rather than dependency, deliverable shapes left
undefined ("dashboard" — a UI or a JSON artifact?), new code with no stated
home, thresholds without semantics. For each item record:

- the question that must be answered before dispatch,
- a provisional assumption specific enough to dispatch under,
- which work unit or review gate it must be pinned by, and what changes in
  the plan if it resolves the other way.

Never resolve an ambiguity silently inside a unit's scope: every interpretive
commitment a scope makes must either be literal root-bead text or appear here
as a flagged assumption. If you find zero items, say so explicitly after
actually checking — a genuinely unambiguous epic is rare.

**Input-authority rule for corrupted sources:** when the notes contain both an
explicit, un-truncated requirement statement (an acceptance list, a stated
count, spelled-out criteria) and a derived table or summary that is truncated,
garbled, or internally inconsistent, the explicit un-truncated text is
authoritative — decompose to it in full. Flag the corrupted rows as an
underspec item; never scope down to what the corrupted table happens to
mention, even with a flagged assumption. A flagged assumption does not license
dropping a requirement the un-truncated text states.

**3. Design the work breakdown** (5-15 units). For each unit decide:

a) **Trace** — the specific clause of the root-bead notes this unit
implements; quote or cite it in the unit description. If you cannot point at
the text, the unit is gold-plating — delete it, or move the idea to the
underspecification list as a question. No CI setup, monitoring, documentation
passes, refactors, or "hardening" the notes never asked for. Then sweep the
other direction: every requirement and acceptance item in the notes maps to
at least one unit; anything deliberately excluded gets an explicit
out-of-scope line in the summary note, not silence.

b) **Boundaries and size** — one worker, one verifiable outcome. Split
tool-building from bulk application of the tool (a linter unit, then a
separate remediation-sweep unit): they route to different tiers and fail in
different ways. Give every unit a size class — one-session / multi-session /
needs-split — and mark bulk mechanical work as shardable. If every unit
landed in the same size class on a heterogeneous epic, re-examine.

c) **Acceptance criteria** — each criterion must let a verification agent who
has read NOTHING but the criterion produce a pass/fail: a command, exit code,
file check, or numeric threshold. Apply two tests to every criterion:

- Strip the scope paragraph: does the criterion alone still name something a
  machine can evaluate? "Is implemented correctly" / "integrates cleanly"
  fail — that is the scope restated, not a criterion.
- Would it pass on a stub implementation? "Tests pass", "the report file is
  generated", "script exits 0" (for a script the same unit authors) are
  vacuous — mechanically checkable but unable to catch a wrong result.

Any unit that builds a checker, validator, or test suite must carry a
NEGATIVE check: a planted-defect fixture the checker must flag AND a clean
fixture it must pass. Verifying that a checker runs is not verifying that it
works. Escape hatches must themselves be verifiable (an exceptions list where
each entry references a filed follow-up bead the verifier can look up). Where
a criterion cannot be fully mechanical, name the residual judgment explicitly
rather than hiding it.

  BAD:  "The adapter is implemented correctly and integrates with the
         shared library."
  GOOD: "QA entrypoint on one sample task emits output that validates
         against the library's jsonschema (exit 0); a known-defective
         fixture task surfaces a class-A finding; a clean fixture passes."

  BAD:  "Remediation complete; lint issues resolved."
  GOOD: "Lint report shows 0 failures, OR only files enumerated in a
         committed exceptions list where each entry carries a filed
         follow-up bead ID (verifier cross-checks each via `bd show`)."

d) **Dependencies** — encode true DATA dependencies only: unit B consumes an
artifact unit A produces. The notes' narrative order ("then do X") is often
priority, not dependency; if you treat it as soft, flag that in the
underspecification list with the schedule consequence of the other reading.
Then run the honesty check — re-derive the parallel waves from your per-unit
dependency lists and inspect the shape:

- Every unit depends on exactly the previous one (waves of size 1)? You have
  narrated your own writing order as a dependency structure. Hunt for the
  independent tracks that can start in wave 0.
- No dependencies at all while the notes state sequencing? You dropped real
  constraints.
- Any unit scheduled in a wave at or before one of its dependencies? Fix it
  before creating links.

Name the critical path in the summary note.

e) **Routing by cognitive load** — route by where the judgment lives, never
by unit size, and never by naming a model:

| Load tier | Signature | Typical gc.routing |
|---|---|---|
| deep reasoning | contract/schema definitions, semantic detection logic, externally-visible synthesis — errors propagate to every consumer | criteria-only |
| well-scoped execution | implementation against a frozen interface; needs code judgment, not architecture | criteria-only, or prescriptive when the exact implementation is specified |
| mechanical | bulk application of a rule decided upstream; sweeps, fixture invocation | prescriptive, shardable |

Record the tier and its reason in each unit's description ("Routing:
mechanical — the semantic judgment lives upstream in the linter rules").
Reasons must be grounded in blast radius or judgment content, not
"complex" / "important". If fewer than one unit in five sits below the top
tier on an epic containing bulk mechanical work, you are spending the
caller's budget to buy yourself safety margin — re-examine.

f) **Gate placement** — every unit gets a review bead (step 4), but two
placements need more than the default:

- Fan-out poison points: when a unit's output is imported or consumed by two
  or more downstream units (a contract, a shared library, a fixture set),
  the downstream units must block on the REVIEW bead, not the work bead — a
  wrong contract must be caught before the wave that imports it dispatches.
  The review bead's description must name the specific wrong result it
  intercepts and what gets poisoned downstream without it.
- Cheap-routed bulk work: the review bead samples at least 10% of shards for
  behavior preservation, not style — bulk mechanical edits are exactly where
  cheap execution silently changes semantics.

In any QA or checker-building epic, at least one gate must target the
"checker that passes everything" failure: the review runs the checker
against a planted-defect fixture, because the worst outcome is a green
report on a defective corpus. The planted fixtures are themselves a quality
surface: at least one gate reviews adversarial-fixture quality — does each
fixture actually exhibit the defect class it claims, and would a lazy checker
pass it? — and that gate routes to the deep-reasoning tier (fixture review is
contract review, not mechanical checking).

**Worked example** (three units distilled from a real three-benchmark QA epic):

    LIB — shared defect-checker library (the contract every rig imports)
      Trace: notes — "new schema-agnostic lib (~300 lines)" + acceptance A2.
      Accept: `pytest` green in the lib repo; a planted dangling-oracle-path
        fixture returns a class-A finding and a clean fixture returns none;
        `python -c "from qa_core.schema import SCHEMA"` succeeds.
      Deps: none (wave 0). Size: multi-session.
      Routing: deep reasoning (criteria-only) — six downstream units import
        this schema; wrong semantics propagate to every rig.
      Gate: downstream adapters block on LIB's REVIEW bead — a false-negative
        checker here makes every later corpus run report a clean corpus that
        isn't.

    LINT — verifier-lint tool over 781 shell files (tool only; sweep is separate)
      Accept: report shows total_files == 781; a planted fixture missing
        `set -euo pipefail` is flagged; a known-clean fixture passes.
      Deps: none — independent track, starts in wave 0 beside LIB, not
        queued behind it. Size: one-session.
      Routing: well-scoped execution (prescriptive).

    SWEEP — remediate the ~328 files failing LINT
      Accept: LINT report shows 0 failures OR only files in a committed
        exceptions list where each entry carries a filed follow-up bead ID
        (verifier cross-checks each via `bd show`).
      Deps: LINT. Size: multi-session, shardable by directory.
      Routing: mechanical (prescriptive) — semantics decided upstream in
        LINT; review bead samples ≥10% of fixes for behavior preservation.

    Underspec: "Where does LIB live and how do three repos consume it?
      Assumption: standalone repo consumed as a package. Pin before LIB
      dispatches — it blocks the packaging half of the unit."

**4. Create the bead graph:**

Declare every bead per the bead-declaration rubric
(`docs/conventions/bead-declaration-rubric.md`): native fields for workflow
semantics, an honest estimate, and the versioned `orchestrator` metadata block.
As the decomposing agent you MAY set estimates, acceptance, `orchestrator`
facts, and structural edges; you MUST NOT invent priority or business value —
inherit the root's priority and never self-escalate (rubric §Anti-gaming):

```bash
# Priority is inherited from the root bead, never invented.
ROOT_PRI=$(bd show {{issue}} --json | jq -r 'if type=="array" then .[0] else . end | .priority // 2')
```

For EACH work unit, create three beads in this exact order:

```bash
# Create the work bead.
#   --priority : inherited from root ($ROOT_PRI); never self-escalate.
#   --estimate : honest p50 in MINUTES (distribution + confidence go in the
#                orchestrator block; a false-precise point is worse than a
#                point plus a wide p90).
#   --acceptance : machine-verifiable completion conditions (a bead a verifier
#                cannot check is not done being specified).
#   orchestrator (schema_version 1): typed solver inputs. requirements are hard
#                constraints, not scores; expected_touches carries confidence
#                because it is a self-prediction scored later against actuals.
#                Fill only what you honestly know; OMIT any key you cannot fill
#                (the --metadata value must stay valid JSON — no leftover <...>).
WORK_ID=$(bd create "<title>" \
  --parent {{issue}} \
  --priority "$ROOT_PRI" \
  --estimate <p50-minutes> \
  --description "<scope, the trace to root-bead text, size class, and routing tier with reason>" \
  --acceptance "<criterion 1>
<criterion 2>
<criterion 3>" \
  --metadata '{"gc.routing": "<prescriptive|criteria-only>", "gc.unit_type": "work", "gc.rig": "{{rig}}", "orchestrator": {"schema_version": 1, "requirements": {"capabilities": [<e.g. "go">], "repositories": ["{{rig}}"], "expected_touches": [{"path": "<glob this unit edits>", "confidence": <0.0-1.0>}]}, "structure": {"splittable": <true|false>, "preemptible": <true|false>}, "estimates": {"duration_minutes": {"p50": <n>, "p90": <n>, "confidence": <0.0-1.0>}}}}' \
  --silent)

echo "Created work bead: $WORK_ID"

# Create the review bead (blocked by work bead). Inherits root priority; the
# `blocks` edge is genuine precedence (review cannot start before work lands).
REVIEW_ID=$(bd create "Review: <title>" \
  --parent {{issue}} \
  --priority "$ROOT_PRI" \
  --description "## Review of $WORK_ID

Verify EVERY acceptance criterion on $WORK_ID is met. You did NOT write this code.

**Procedure for each criterion:**
1. READ: Find the code that implements it
2. TEST: Run the verification command or check
3. VERDICT: PASS or FAIL with evidence

**Acceptance criteria to verify:**
<copy exact criteria from work bead>

**Gate note (fan-out and cheap-bulk units only):**
<the specific wrong result this review intercepts, and which downstream
units get poisoned if it slips through; for bulk sweeps, the ≥10% sampling
instruction>

**Also check:**
- No extraneous changes outside the unit's scope
- Code follows existing codebase conventions
- No security issues (injection, auth, data exposure)

Output a structured report:
## Criterion Checklist
- [criterion]: PASS/FAIL — evidence

## Verdict
PASS or FAIL with specific issues to fix" \
  --metadata '{"gc.routing": "prescriptive", "gc.unit_type": "review", "gc.review_target": "'$WORK_ID'", "gc.rig": "{{rig}}"}' \
  --deps "blocks:$WORK_ID" \
  --silent)

echo "Created review bead: $REVIEW_ID (blocked by $WORK_ID)"

# Create the meta-review bead (blocked by review bead). Inherits root priority.
META_ID=$(bd create "Meta-review: <title>" \
  --parent {{issue}} \
  --priority "$ROOT_PRI" \
  --description "## Meta-review of $REVIEW_ID (reviewing $WORK_ID)

You are reviewing THE REVIEW, not the code. Check:

1. Did the reviewer actually test each criterion, or just read the code?
2. Was evidence provided for each PASS verdict?
3. Were any criteria skipped or hand-waved?
4. Could a PASS verdict be a false positive?
5. Is the review thorough enough to catch real issues?

Read the review bead notes for the reviewer's report:
```bash
bd show $REVIEW_ID
```

Then check the actual code state yourself for at least 2 criteria.

## Meta-Review Verdict
PASS — review was thorough and accurate
or
FAIL — specific gaps in the review (reviewer must redo)" \
  --metadata '{"gc.routing": "prescriptive", "gc.unit_type": "meta-review", "gc.review_target": "'$REVIEW_ID'", "gc.rig": "{{rig}}"}' \
  --deps "blocks:$REVIEW_ID" \
  --silent)

echo "Created meta-review bead: $META_ID (blocked by $REVIEW_ID)"
```

**5. Wire dependencies between work units:**

If work unit B consumes an artifact from work unit A:
```bash
bd link $WORK_B_ID $WORK_A_ID  # A blocks B
```

For fan-out poison points (A's output imported by 2+ units), block the
consumers on A's REVIEW instead, so the gate fires before the wave dispatches:
```bash
bd link $WORK_B_ID $REVIEW_A_ID  # A's review blocks B
```

**6. Record the decomposition summary:**

```bash
bd note {{issue}} --file /dev/stdin <<'NOTE'
## Decomposition Complete

### Work Units Created
[Each work bead: ID, title, trace, size class, load tier, routing, deps]

### Dependency Graph and Waves
[Per-unit deps; the waves re-derived from them; the named critical path.
Note any narrative-order sequencing treated as soft, with its underspec item.]

### Routing Summary
- criteria-only: [count] units
- prescriptive: [count] units
- reviews + meta-reviews: [count] each (always prescriptive)

### Out of Scope
[Requirements deliberately excluded, each with a filed follow-up bead or an
explicit rationale — never silent]

### Underspecified — pinned assumptions
[Each question + provisional assumption + which unit/gate must pin it, or
"none found after checking"]
NOTE
```

**7. Update metadata and signal ready for dispatch:**
```bash
bd update {{issue}} --set-metadata phase=decompose_complete
bd update {{issue}} --append-notes "Decomposition complete. $(date -Iseconds)"
```

**CRITICAL RULES:**
- Every acceptance criterion passes the strip-the-scope and stub tests
- Every checker/validator unit carries a planted-defect negative check
- Every work bead cites the root-bead text it traces to — no gold-plating
- Every work bead has a review bead and a meta-review bead
- Review and meta-review beads are ALWAYS prescriptive
- Never name a model in bead content — load tiers only
- Do NOT close the root bead"""

[[steps]]
id = "drain"
title = "Signal completion"
needs = ["decompose"]
description = """
Work is done. Signal the controller to reclaim this session:

```bash
gc runtime drain-ack
```

Run this command and nothing else."""
