description = """
Graph-first worktree lifecycle.

This is the built-in v2 workflow prototype for Gas City. It models work as an
explicit DAG with:

- a durable `body` scope bead
- explicit worktree setup and teardown
- first-class step beads that can be routed independently
- continuation metadata for same-session execution

Use this as the opt-in replacement for hierarchy-first single-session formulas.
"""
formula = "mol-scoped-work"

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.base_branch]
description = "Base branch to branch from"
default = "main"

[vars.setup_command]
description = "Optional setup command (install deps, bootstrap tools)"
default = ""

[vars.typecheck_command]
description = "Optional typecheck command"
default = ""

[vars.lint_command]
description = "Optional lint command"
default = ""

[vars.build_command]
description = "Optional build command"
default = ""

[vars.test_command]
description = "Optional test command"
default = ""

[[steps]]
id = "load-context"
title = "Load context and inspect the assignment"
description = """
Prime the workspace, inspect the assigned work, and understand the current bead
metadata before doing anything destructive.

```bash
gc prime
gc bd prime
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-scoped-work requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
gc bd show "$WORK_BEAD_ID"
gc bd show "$WORK_BEAD_ID" --json | jq '.[0].metadata'
gc mail inbox
```
"""
metadata = { "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "body"
title = "Worktree body scope"
needs = ["workspace-setup", "preflight-tests", "implement", "self-review", "submit"]
description = """
Terminal latch for the main worktree body.

Normal work beads inside this scope can fail. Paired `scope-check` control
beads handle fail-fast skipping, close this bead with `gc.outcome=fail|pass`,
and allow teardown to proceed.
"""
metadata = { "gc.kind" = "scope", "gc.scope_name" = "worktree", "gc.scope_role" = "body" }

[[steps]]
id = "workspace-setup"
title = "Set up a worktree and branch"
needs = ["load-context"]
description = """
Ensure there is an isolated worktree for this work item.

`gc worktree ensure` is the transactional owner of workspace provisioning: it
is idempotent, so there is no reuse branch to get wrong, and it rolls back a
failed creation instead of leaving a half-made tree. Its provenance is what
the cleanup-worktree step below reads to decide whether a workspace is safe to
remove, so publishing it here is what makes the workspace's end of life
recordable rather than inferred.

```bash
git fetch --prune origin
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-scoped-work requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
REPO_ROOT=$(git rev-parse --show-toplevel)
WORKTREE_ROOT="$REPO_ROOT/worktrees"
WORKTREE_PATH="$WORKTREE_ROOT/$WORK_BEAD_ID"
BRANCH="work/$WORK_BEAD_ID"
# Cut from the LOCAL base when it exists; fall back to the remote-tracking ref
# only when it does not. A local base that has moved ahead is the base the
# caller means.
BASE_REF="{{base_branch}}"
git rev-parse --verify --quiet "$BASE_REF" >/dev/null || BASE_REF="origin/{{base_branch}}"

# `gc worktree ensure` requires the full provenance contract: creator, owner,
# generation and store-ref are mandatory, not optional. Omitting them fails the
# command outright with "required flag(s) not set".
#
# Store ref comes from the seat environment, NOT from the work bead's own
# metadata: a freshly-dispatched bead carries no gc.root_store_ref of its own
# (it lives on the workflow root and the trigger env instead). Prefer the
# work-bead store, fall back to the trigger bead's, and only then to the
# bead's own recorded root_store_ref.
STORE_REF="${GC_TRIGGER_WORK_STORE_REF:-${GC_TRIGGER_BEAD_STORE_REF:-}}"
if [ -z "$STORE_REF" ]; then
  STORE_REF=$(gc bd show "$WORK_BEAD_ID" --json | jq -r '.[0].metadata["gc.root_store_ref"] // empty')
fi
if [ -z "$STORE_REF" ]; then
  echo "FATAL: cannot resolve a bead store reference (GC_TRIGGER_WORK_STORE_REF, GC_TRIGGER_BEAD_STORE_REF, and gc.root_store_ref are all empty)." >&2
  exit 1
fi
CREATOR="formula:mol-scoped-work"
GENERATION="$CREATOR:$WORK_BEAD_ID"

if ! ENSURE_JSON=$(gc worktree ensure \
      --repo "$REPO_ROOT" --root "$WORKTREE_ROOT" --path "$WORKTREE_PATH" \
      --branch "$BRANCH" --base "$BASE_REF" \
      --bead "$WORK_BEAD_ID" --creator "$CREATOR" --owner "$CREATOR" \
      --generation "$GENERATION" --store-ref "$STORE_REF" \
      --lifecycle active --json); then
  echo "FATAL: gc worktree ensure failed for $WORK_BEAD_ID" >&2
  exit 1
fi
# A zero exit is not evidence. Assert the postconditions the later steps and
# the teardown depend on before publishing any of them.
if ! printf '%s' "$ENSURE_JSON" | jq -e '
      select(.ok == true
             and (.path | length) > 0
             and (.branch | length) > 0
             and (.provenance.bead_id | length) > 0
             and (.provenance.store_ref | length) > 0
             and (.provenance.base_ref | length) > 0
             and (.provenance.base_sha | length) > 0
             and (.provenance.creator | length) > 0
             and (.provenance.owner | length) > 0
             and (.provenance.generation | length) > 0
             and (.provenance.attempt_id | length) > 0
             and (.provenance.lifecycle | length) > 0)' >/dev/null; then
  echo "FATAL: gc worktree ensure returned invalid evidence: $ENSURE_JSON" >&2
  exit 1
fi
BASE_SHA=$(printf '%s' "$ENSURE_JSON" | jq -r '.provenance.base_sha')
WORKTREE_STORE_REF=$(printf '%s' "$ENSURE_JSON" | jq -r '.provenance.store_ref')
WORKTREE_CREATOR=$(printf '%s' "$ENSURE_JSON" | jq -r '.provenance.creator')
WORKTREE_OWNER=$(printf '%s' "$ENSURE_JSON" | jq -r '.provenance.owner')
WORKTREE_GENERATION=$(printf '%s' "$ENSURE_JSON" | jq -r '.provenance.generation')
WORKTREE_ATTEMPT_ID=$(printf '%s' "$ENSURE_JSON" | jq -r '.provenance.attempt_id')
WORKTREE_LIFECYCLE=$(printf '%s' "$ENSURE_JSON" | jq -r '.provenance.lifecycle')

gc bd update "$WORK_BEAD_ID" \
  --set-metadata gc.root_store_ref="$WORKTREE_STORE_REF" \
  --set-metadata gc.work_dir="$WORKTREE_PATH" \
  --set-metadata work_dir="$WORKTREE_PATH" \
  --set-metadata gc.work_branch="$BRANCH" \
  --set-metadata gc.worktree_repo="$REPO_ROOT" \
  --set-metadata gc.worktree_root="$WORKTREE_ROOT" \
  --set-metadata gc.worktree_base_ref="$BASE_REF" \
  --set-metadata gc.worktree_base_sha="$BASE_SHA" \
  --set-metadata gc.worktree_creator="$WORKTREE_CREATOR" \
  --set-metadata gc.worktree_owner="$WORKTREE_OWNER" \
  --set-metadata gc.worktree_generation="$WORKTREE_GENERATION" \
  --set-metadata gc.worktree_attempt_id="$WORKTREE_ATTEMPT_ID" \
  --set-metadata gc.worktree_lifecycle="$WORKTREE_LIFECYCLE"

cd "$WORKTREE_PATH"
{{setup_command}}
```
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "setup", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "preflight-tests"
title = "Run preflight checks on the base branch"
needs = ["workspace-setup"]
description = """
Run the configured checks before implementation.

```bash
{{typecheck_command}}
{{lint_command}}
{{test_command}}
```
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "implement"
title = "Implement the requested change"
needs = ["preflight-tests"]
description = """
Make the code changes for convoy `{{convoy_id}}` in the worktree. Commit focused changes
as needed and keep the branch scoped to this work.
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "self-review"
title = "Review the diff and run verification"
needs = ["implement"]
description = """
Inspect the change and run verification commands.

```bash
git diff origin/{{base_branch}}...HEAD
{{typecheck_command}}
{{lint_command}}
{{build_command}}
{{test_command}}
git status
```
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "submit"
title = "Finalize the work item"
needs = ["self-review"]
description = """
Perform the city-specific finalization for this work item. Examples:

- push the branch and hand off to a reviewer
- close the original work bead
- update metadata for downstream systems

This is intentionally generic so cities can opt into the graph contract
without inheriting Gastown's exact human workflow.
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "cleanup-worktree"
title = "Clean up the worktree"
needs = ["body"]
description = """
Record the terminal disposition of the workspace after the body reaches a
terminal state.

`gc worktree cleanup` is the transactional owner of workspace teardown and has
no force mode on purpose. It requires the exact provenance workspace-setup
published (creator, owner, generation, attempt id, store ref); a missing or
mismatched field is a refusal, not a bug to route around. A refusal is a
result: a workspace holding uncommitted, stashed, or unpushed work survives,
and the retention is an obligation somebody can act on, recorded in
gc.worktree_disposition_note. The previous bare `git worktree remove --force
|| rm -rf` destroyed that work unconditionally and then unset `work_dir`,
leaving nothing to recover it by.

```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-scoped-work requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
BEAD_JSON=$(gc bd show "$WORK_BEAD_ID" --json)
WORKTREE=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata.work_dir // empty')
if [ -z "$WORKTREE" ]; then
  echo "cleanup: no work_dir recorded for $WORK_BEAD_ID; nothing to tear down" >&2
  exit 0
fi

REPO=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata["gc.worktree_repo"] // empty')
ROOT=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata["gc.worktree_root"] // empty')
BRANCH=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata["gc.work_branch"] // empty')
BASE_REF=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata["gc.worktree_base_ref"] // empty')
CREATOR=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata["gc.worktree_creator"] // empty')
OWNER=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata["gc.worktree_owner"] // empty')
GENERATION=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata["gc.worktree_generation"] // empty')
STORE_REF=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata["gc.root_store_ref"] // empty')
ATTEMPT_ID=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata["gc.worktree_attempt_id"] // empty')

MISSING=""
for pair in "gc.worktree_repo:$REPO" "gc.worktree_root:$ROOT" "gc.work_branch:$BRANCH" \
            "gc.worktree_base_ref:$BASE_REF" "gc.worktree_creator:$CREATOR" \
            "gc.worktree_owner:$OWNER" "gc.worktree_generation:$GENERATION" \
            "gc.root_store_ref:$STORE_REF" "gc.worktree_attempt_id:$ATTEMPT_ID"; do
  key="${pair%%:*}"
  val="${pair#*:}"
  if [ -z "$val" ]; then
    MISSING="${MISSING:+$MISSING,}$key"
  fi
done

if [ -n "$MISSING" ]; then
  gc bd update "$WORK_BEAD_ID" \
    --set-metadata gc.worktree_disposition=retained \
    --set-metadata gc.worktree_disposition_note="mol-scoped-work body reached terminal state" \
    --set-metadata gc.worktree_retained_reason="incomplete_provenance:$MISSING" \
    --set-metadata gc.worktree_recovery_owner=unknown
  echo "cleanup: retaining $WORKTREE — incomplete provenance: $MISSING" >&2
  exit 0
fi

if CLEANUP_JSON=$(gc worktree cleanup \
      --repo "$REPO" --root "$ROOT" --path "$WORKTREE" \
      --branch "$BRANCH" --base "$BASE_REF" \
      --bead "$WORK_BEAD_ID" --creator "$CREATOR" --owner "$OWNER" \
      --generation "$GENERATION" --store-ref "$STORE_REF" \
      --attempt-id "$ATTEMPT_ID" --json); then
  gc bd update "$WORK_BEAD_ID" \
    --set-metadata gc.worktree_disposition=removed \
    --set-metadata gc.worktree_disposition_note="mol-scoped-work body reached terminal state" \
    --unset-metadata gc.worktree_retained_reason \
    --unset-metadata gc.worktree_recovery_owner \
    --unset-metadata work_dir \
    --unset-metadata gc.work_dir
else
  REASON=$(printf '%s' "$CLEANUP_JSON" | jq -r '.error.message // "gc worktree cleanup refused"')
  gc bd update "$WORK_BEAD_ID" \
    --set-metadata gc.worktree_disposition=retained \
    --set-metadata gc.worktree_disposition_note="mol-scoped-work body reached terminal state" \
    --set-metadata gc.worktree_retained_reason="$REASON" \
    --set-metadata gc.worktree_recovery_owner=unknown
  echo "cleanup: retaining $WORKTREE — $REASON" >&2
fi
```
"""
metadata = { "gc.kind" = "cleanup", "gc.scope_ref" = "body", "gc.scope_role" = "teardown" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"
